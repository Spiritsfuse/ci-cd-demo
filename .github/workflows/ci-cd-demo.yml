name: Hello GitHub Actions
on:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello from GitHub Actions!"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a
      - name: Show my name
        run: echo "My name is Dhruv Sharma"
  bye:
    runs-on: ubuntu-latest
    steps:
      - name: Print goodbye message
        run: echo "Bye from GitHub Actions!"
      - name: show last commit id
        run: git rev-parse HEAD
